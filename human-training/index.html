<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive A–Z coordinate grid for the Human Training v0.1 Warcraft III map.">
  <meta name="color-scheme" content="dark">
  <title>Human Training v0.1 · Map Coordinates</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #11150f;
      --foreground: #f2ead8;
      --card: #1b2118;
      --card-foreground: #f2ead8;
      --muted: #263020;
      --muted-foreground: #b8b19e;
      --accent: #356f39;
      --accent-foreground: #fff3c4;
      --border: #59654d;
      --font-size-base: 16px;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-width: 0;
      background:
        radial-gradient(circle at top, rgba(69, 91, 55, 0.3), transparent 34rem),
        var(--background);
      color: var(--foreground);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100% - 2rem, 860px);
      margin: 0 auto;
      padding: 2rem 0 3rem;
    }
    .card {
      padding: 0.8rem 1rem;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--card-foreground);
      border-radius: 0.5rem;
    }
    .text-muted {
      color: var(--muted-foreground);
    }
    .text-small {
      font-size: 0.8rem;
    }
    @media (max-width: 500px) {
      main {
        width: min(100% - 1rem, 860px);
        padding-top: 1rem;
      }
    }
  </style>
</head>

    <style>
    #human-training-coordinate-map {
      width: 100%;
      color: var(--foreground);
    }
    #human-training-coordinate-map h2 {
      margin: 0 0 0.75rem;
    }
    #human-training-coordinate-map .coordinate-summary {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    #human-training-coordinate-map .coordinate-summary strong {
      font-size: calc(var(--font-size-base) * 1.35);
      font-weight: 500;
    }
    #human-training-coordinate-map .coordinate-layout {
      display: grid;
      grid-template-columns: 2rem minmax(0, 1fr);
      grid-template-rows: 1.5rem auto;
      align-items: stretch;
      width: 100%;
      min-width: 0;
    }
    #human-training-coordinate-map .axis-columns {
      display: grid;
      grid-template-columns: repeat(26, 1fr);
      align-items: end;
      min-width: 0;
    }
    #human-training-coordinate-map .axis-rows {
      display: grid;
      grid-template-rows: repeat(26, 1fr);
      align-items: center;
    }
    #human-training-coordinate-map .axis span {
      color: var(--muted-foreground);
      font-size: 11px;
      text-align: center;
      min-width: 0;
    }
    #human-training-coordinate-map .map-plane {
      position: relative;
      display: block;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      aspect-ratio: 1;
      box-sizing: border-box;
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 0;
      background: var(--muted);
      cursor: crosshair;
    }
    #human-training-coordinate-map .map-plane img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: auto;
      user-select: none;
      pointer-events: none;
    }
    #human-training-coordinate-map .fine-grid,
    #human-training-coordinate-map .major-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #human-training-coordinate-map .fine-grid {
      background-image:
        repeating-linear-gradient(to right, color-mix(in srgb, var(--foreground) 35%, transparent) 0 1px, transparent 1px calc(100% / 26)),
        repeating-linear-gradient(to bottom, color-mix(in srgb, var(--foreground) 35%, transparent) 0 1px, transparent 1px calc(100% / 26));
    }
    #human-training-coordinate-map .major-grid {
      background-image:
        repeating-linear-gradient(to right, color-mix(in srgb, var(--foreground) 65%, transparent) 0 2px, transparent 2px calc(500% / 26)),
        repeating-linear-gradient(to bottom, color-mix(in srgb, var(--foreground) 65%, transparent) 0 2px, transparent 2px calc(500% / 26));
    }
    #human-training-coordinate-map .selection {
      position: absolute;
      left: calc(12 * 100% / 26);
      top: calc(12 * 100% / 26);
      width: calc(100% / 26);
      height: calc(100% / 26);
      background: color-mix(in srgb, var(--accent) 55%, transparent);
      box-shadow: inset 0 0 0 2px var(--accent-foreground);
      pointer-events: none;
    }
    #human-training-coordinate-map .map-key {
      margin-top: 0.5rem;
      text-align: center;
    }
    @media (max-width: 500px) {
      #human-training-coordinate-map .coordinate-layout {
        grid-template-columns: 1.6rem minmax(0, 1fr);
      }
      #human-training-coordinate-map .axis-columns span:nth-child(even),
      #human-training-coordinate-map .axis-rows span:nth-child(even) {
        visibility: hidden;
      }
      #human-training-coordinate-map .coordinate-summary {
        flex-wrap: wrap;
      }
    }
    </style>
    
    <script>
    (function () {
      const root = document.getElementById('human-training-coordinate-map');
      const map = root.querySelector('#ht-map');
      const columns = root.querySelector('#ht-columns');
      const rows = root.querySelector('#ht-rows');
      const coordinate = root.querySelector('#ht-coordinate');
      const position = root.querySelector('#ht-position');
      const selection = root.querySelector('#ht-selection');
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let selectedColumn = 12;
      let selectedRow = 12;
    
      letters.split('').forEach(function (letter) {
        const label = document.createElement('span');
        label.textContent = letter;
        columns.appendChild(label);
      });
      for (let number = 1; number <= 26; number += 1) {
        const label = document.createElement('span');
        label.textContent = number;
        rows.appendChild(label);
      }
    
      function describe(column, row) {
        const horizontal = column < 8 ? 'left side' : column > 17 ? 'right side' : 'centre';
        const vertical = row < 8 ? 'top' : row > 17 ? 'bottom' : 'middle';
        return vertical + ', ' + horizontal;
      }
    
      function selectCell(column, row) {
        selectedColumn = Math.max(0, Math.min(25, column));
        selectedRow = Math.max(0, Math.min(25, row));
        const name = letters[selectedColumn] + String(selectedRow + 1);
        coordinate.textContent = name;
        position.textContent = describe(selectedColumn, selectedRow);
        selection.style.left = 'calc(' + selectedColumn + ' * 100% / 26)';
        selection.style.top = 'calc(' + selectedRow + ' * 100% / 26)';
        map.setAttribute('aria-label', 'Map coordinate grid. Selected ' + name + '. Click a square or use arrow keys.');
      }
    
      map.addEventListener('click', function (event) {
        const bounds = map.getBoundingClientRect();
        const column = Math.floor((event.clientX - bounds.left) / bounds.width * 26);
        const row = Math.floor((event.clientY - bounds.top) / bounds.height * 26);
        selectCell(column, row);
      });
    
      map.addEventListener('keydown', function (event) {
        const keys = {
          ArrowLeft: [-1, 0],
          ArrowRight: [1, 0],
          ArrowUp: [0, -1],
          ArrowDown: [0, 1]
        };
        if (!keys[event.key]) return;
        event.preventDefault();
        selectCell(selectedColumn + keys[event.key][0], selectedRow + keys[event.key][1]);
      });
    
      selectCell(selectedColumn, selectedRow);
    })();
    </script>
  </main>
</body>
